<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PathSnap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { margin: 0; font-family: sans-serif; }
    #controls { padding: 12px; display: flex; gap: 8px; align-items: center; }
    #map { height: calc(100vh - 58px); }
  </style>
</head>
<body>
  <div id="controls">
    <label>API <input id="api" value="http://localhost:8000"></label>
    <label>Trip <input id="trip" value=""></label>
    <button id="run">Reconstruct route</button>
    <strong id="result"></strong>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([12.9716, 77.5946], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    document.getElementById("run").addEventListener("click", async () => {
      const api = document.getElementById("api").value.replace(/\/$/, "");
      const trip = document.getElementById("trip").value;
      const response = await fetch(api + "/route", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({trip_id: trip})
      });
      if (!response.ok) throw new Error(await response.text());
      const data = await response.json();
      document.getElementById("result").textContent =
        data.accuracy === undefined ? "Route reconstructed" :
        "Accuracy: " + (data.accuracy * 100).toFixed(1) + "%";
    });
  </script>
</body>
</html>
